name: Deploy static edition to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_RUNTIME_MODE: static
      VITE_PAGES_BASE_PATH: ${{ vars.VITE_PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      VITE_LANGUAGE_API_URL: ${{ vars.VITE_LANGUAGE_API_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Require deployed language Worker URL
        run: test -n "$VITE_LANGUAGE_API_URL" || (echo "::error::Set repository variable VITE_LANGUAGE_API_URL to the deployed Cloudflare Worker URL" && exit 1)
      - name: Build GitHub Pages edition
        run: npm run build:pages
      - name: Static smoke
        run: npm run smoke:static
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
