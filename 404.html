    <script>
      // Cơ chế tự động dọn sạch Service Worker cũ & cache rác
      (function () {
        const CURRENT_SW_VERSION = 'v2.9.29';
        const LS_KEY = 'lexis_sw_cleanup_version';

        if (localStorage.getItem(LS_KEY) !== CURRENT_SW_VERSION) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (var i = 0; i < names.length; i++) {
                // Chỉ xóa cache tĩnh cũ, giữ nguyên runtime cache (Workbox) và piper-voices
                if (names[i].indexOf('lexis-static-') === 0 && names[i].indexOf('v2.9.21') === -1) {
                  caches.delete(names[i]);
                }
              }
            });
          }
          localStorage.setItem(LS_KEY, CURRENT_SW_VERSION);
        }
      })();

      // Ngăn chặn lỗi uncaught promise do Extension trình duyệt chèn vào (như M_ID, onboarding.js)
      window.addEventListener('unhandledrejection', function (event) {
        try {
          var reason = (event && event.reason ? String(event.reason.stack || event.reason.message || event.reason) : '').toLowerCase();

            reason.indexOf('eppiocemhmnlbhjplcgkofciiegomcon') !== -1 ||
            reason.indexOf('contentscript.js') !== -1 ||
            reason.indexOf("reading 'm_id'") !== -1 ||
            reason.indexOf('m_id') !== -1
          ) {
            event.preventDefault();
          }
        } catch (e) {}
      });
